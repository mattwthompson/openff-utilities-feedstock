schema_version: 1

context:
  org: openforcefield
  name: openff-utilities
  version: "0.1.17"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/${{ org }}/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 28b1fac10a285f65ed38213c8bf00be76542a0bcb23240eee2dbe5d27497b3f3

build:
  number: 0
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} ${{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - openff.utilities
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      recipe:
        - test_package.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - packaging
        - ambertools >=24
        - micromamba
    script:
      - python test_package.py

about:
  license: MIT
  license_file: LICENSE
  summary: A collection of miscellaneous utility functions used by experimental OpenFF packages
  homepage: https://openforcefield.org/
  repository: https://github.com/openforcefield/openff-utilities

extra:
  recipe-maintainers:
    - mattwthompson
    - j-wags
