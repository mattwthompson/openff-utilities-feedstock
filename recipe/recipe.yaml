schema_version: 1

context:
  org: openforcefield
  name: openff-utilities
  version: "0.1.18"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/${{ org }}/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ec51ba7f0923e03a9df29ab70eff801985ce10ad056075f48acf1d290c247616

build:
  number: 0
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} ${{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - openff.utilities
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python test_package.py
    requirements:
      run:
        - python ${{ python_min }}.*
        - packaging
        - ambertools >=24
        - micromamba  # trying to test get_ambertools_version, but doesn't work _in_ feedstock for unknown reasons
    files:
      recipe:
        - test_package.py

about:
  license: MIT
  license_file: LICENSE
  summary: A collection of miscellaneous utility functions used by experimental OpenFF packages
  homepage: https://openforcefield.org/
  repository: https://github.com/openforcefield/openff-utilities

extra:
  recipe-maintainers:
    - mattwthompson
    - j-wags
